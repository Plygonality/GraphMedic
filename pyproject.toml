[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphmedic"
version = "0.1.0"
description = "Static diagnostics for procedural node graphs. Finds definite defects and separates them from heuristic warnings before a DCC cook."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Plygonality" }]
keywords = ["blender", "geometry-nodes", "procedural", "linter", "sarif"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "jsonschema>=4.20", "build>=1.2"]

[project.scripts]
graphmedic = "graphmedic.cli:main"

[project.urls]
Homepage = "https://github.com/Plygonality/GraphMedic"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
graphmedic = ["py.typed", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
